name: Release

# Push a version tag to publish a release, for example:
#   git tag v0.1.0
#   git push origin v0.1.0
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # needed to create the GitHub release

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Version from tag
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          "version=$($tag.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test FileSearch.sln -c Release

      - name: Publish single-file exe
        run: >
          dotnet publish src/FileSearch.App -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:Version=${{ steps.ver.outputs.version }} -o publish

      - name: Package
        id: pkg
        shell: pwsh
        run: |
          $name = "FileSearch-${{ steps.ver.outputs.version }}-win-x64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item publish/FileSearch.exe, LICENSE, THIRD-PARTY-NOTICES.md, README.md $name
          Compress-Archive -Path "$name/*" -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Set-Content "$name.zip.sha256" -Encoding ascii
          "zip=$name.zip" >> $env:GITHUB_OUTPUT

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "${{ steps.pkg.outputs.zip }}"
          (Get-Content .github/release-notes.md -Raw).Replace('<version>', '${{ steps.ver.outputs.version }}') |
            Set-Content notes.md -Encoding utf8
          # The text from notes.md comes first; GitHub's generated change list is appended after it.
          gh release create "${{ github.ref_name }}" $zip "$zip.sha256" `
            --title "File Search ${{ github.ref_name }}" `
            --generate-notes `
            --notes-file notes.md
